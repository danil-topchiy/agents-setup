# Shareable personal-assistant policy for a NEW profile, before model login.
# Native file, shell, and Python tools use the OS account's permissions.
# cwd is a starting directory, not a filesystem sandbox.
terminal:
  backend: local
  cwd: "."
platform_toolsets:
  cli: [terminal, file, code_execution, memory, skills, session_search, todo, clarify]
  telegram: [terminal, file, code_execution, memory, skills, session_search, todo, clarify]
  email: [terminal, file, code_execution, memory, skills, session_search, todo, clarify]
approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
agent:
  max_turns: 60
  # Keep the explicit capability list even inside Git workspaces.
  coding_context: "off"
  disabled_toolsets:
    - browser
    - computer_use
    - delegation
    - cronjob
    - connections
    - kanban
code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50
auth:
  adopt_external_logins: false
security:
  redact_secrets: true
gateway:
  allow_all_users: false
  unauthorized_dm_behavior: ignore
telegram:
  guest_mode: false
  observe_unmentioned_group_messages: false
memory:
  write_approval: true
skills:
  write_approval: true
  auto_load: []
tools:
  tool_search:
    enabled: auto
